[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Retrieval-augmented research assistant: RAG pipeline, MCP tools, LangGraph agents, DPO-tuned reranker."
requires-python = ">=3.11,<3.12"
dependencies = [
  # --- shared / contracts ---
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  # --- Track A: ingestion ---
  "pymupdf>=1.24",          # PDF text + page numbers + font sizes (section heuristics)
  "tiktoken>=0.7",          # token-budgeted chunking
  # --- Track A: retrieval ---
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  # --- Track A: evaluation ---
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
]

[project.optional-dependencies]
# Heavy; only needed from stage 08 onward. `pip install -e ".[train]"`
train = [
  "torch>=2.3",
  "transformers>=4.42",
  "datasets>=2.20",
  "trl>=0.9",
  "peft>=0.11",
  "accelerate>=0.32",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]
obs = [
  "langfuse>=2.50",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]
# Track B (Sude): MCP server, judge, agents, eval gate. Dropped in an earlier
# merge (fixed here 2026-09-21) -- restoring so `mcp`/`langgraph`/`anthropic`
# etc. are installable at all, not just missing from this one venv.
serve = [
  "mcp>=2.2,<3",  # server_S.py uses the 2.x MCPServer API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
agents = [
  "langgraph>=0.2.40",
  "langchain-core>=0.3",
]
judge = [
  "anthropic>=0.40",
  "google-genai>=2.20",  # Gemini backend has a free tier, no card required
]
# Already in the base dependencies; kept as an (intentionally redundant) extra
# because docker/mcp_S.Dockerfile and both CI workflows install `.[...,eval,...]`.
eval = [
  "numpy>=1.26",
  "mlflow>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Without the plugin mypy does not know Field(None, ...) gives a default,
# and reports every optional contract field as a missing argument.
plugins = ["pydantic.mypy"]

# numpy ships stubs written with 3.12+ `type` statements. Analysing them under
# python_version 3.11 is a syntax error in *their* file, which aborts the whole run
# before any of our code is checked - and hides every real error behind it.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true

# pymupdf's stubs omit Document.__iter__, which exists at runtime.
[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true

[project]
name = "research-assistant"
version = "0.1.0"
description = "Retrieval-augmented research assistant: RAG + MCP tools + LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Track B (Sude): MCP server, judge, agents, eval gate.
serve = [
    "mcp>=2.2,<3",  # server_S.py uses the 2.x MCPServer API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
agents = [
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
]
judge = [
    "anthropic>=0.40",
    "google-genai>=2.20",  # Gemini backend — has a free tier, no card required
]
obs = [
    "langfuse>=2.50",
]
eval = [
    "numpy>=1.26",
    "mlflow>=2.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# Without the plugin mypy does not know Field(None, ...) gives a default,
# and reports every optional contract field as a missing argument.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

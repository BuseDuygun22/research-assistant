[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Retrieval-augmented research assistant: RAG pipeline, MCP tools, LangGraph agents, DPO-tuned reranker."
requires-python = ">=3.11,<3.12"
dependencies = [
  # --- shared / contracts ---
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  # --- Track A: ingestion ---
  "pymupdf>=1.24",          # PDF text + page numbers + font sizes (section heuristics)
  "tiktoken>=0.7",          # token-budgeted chunking
  # --- Track A: retrieval ---
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  # --- Track A: evaluation ---
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
]

[project.optional-dependencies]
# Heavy; only needed from stage 08 onward. `pip install -e ".[train]"`
train = [
  "torch>=2.3",
  "transformers>=4.42",
  "datasets>=2.20",
  "trl>=0.9",
  "peft>=0.11",
  "accelerate>=0.32",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]
obs = [
  "langfuse>=2.39",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

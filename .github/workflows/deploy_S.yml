# Build and publish the service image (Sude).
#
# Gated on readiness, not merely on a green build. The container is *live* as
# soon as the process answers and *ready* only once a backend can serve a query.
# Deploying on liveness alone is exactly how a service goes green with no index
# behind it, which is the failure the eval gate exists to catch downstream.

name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f docker/mcp_S.Dockerfile -t research-assistant:${{ github.sha }} .

      - name: Refuse to ship a container that cannot become ready
        run: |
          docker run -d --name ra -p 8000:8000 research-assistant:${{ github.sha }}
          STATUS=waiting
          for _ in $(seq 1 30); do
            STATUS=$(curl -fsS http://localhost:8000/ready \
              | python -c "import sys,json;print(json.load(sys.stdin)['status'])" 2>/dev/null \
              || echo waiting)
            case "$STATUS" in ok|degraded) break ;; esac
            sleep 2
          done
          echo "readiness: $STATUS"
          docker logs ra
          docker rm -f ra
          case "$STATUS" in
            ok) ;;
            degraded) echo "::warning::shipping with a degraded backend" ;;
            *) echo "::error::never became ready"; exit 1 ;;
          esac

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker tag research-assistant:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
